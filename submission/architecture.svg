<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GroundTruth cloud architecture</title><desc id="desc">Student and teacher browsers connect to GroundTruth on Vercel, which enforces access and learning state, reads public source, calls Meta inference and persists records in Supabase. This diagram is not proof of a live request.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#17695f" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="900" fill="#fafaf7"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="75" y="85" fill="#17695f" font-size="15" font-weight="700" letter-spacing="2">GROUNDTRUTH / CLOUD ARCHITECTURE</text><text x="70" y="151" fill="#192239" font-size="49" font-weight="700" letter-spacing="-1.8">The server owns the learning boundary.</text><text x="75" y="193" fill="#647082" font-size="22">Source-linked guidance, independent attempts and explicit human review.</text></g>
<g fill="none" stroke="#17695f" stroke-width="2.5" marker-end="url(#arrow)"><path d="M385 360H545"/><path d="M385 610H465V455H545"/><path d="M970 375H1085V335H1150"/><path d="M970 455H1150"/><path d="M970 535H1085V635H1150"/></g>
<g font-family="Arial,Helvetica,sans-serif"><rect x="75" y="280" width="310" height="160" rx="18" fill="white" stroke="#dfe3e8"/><text x="100" y="319" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">LEARNER</text><text x="100" y="359" fill="#192239" font-size="28" font-weight="700">Student browser</text><text x="100" y="399" fill="#647082" font-size="18">Source, concepts and practice</text>
<rect x="75" y="535" width="310" height="160" rx="18" fill="white" stroke="#dfe3e8"/><text x="100" y="574" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">HUMAN REVIEW</text><text x="100" y="614" fill="#192239" font-size="28" font-weight="700">Teacher browser</text><text x="100" y="654" fill="#647082" font-size="18">Approved role + explicit share</text>
<rect x="545" y="270" width="425" height="425" rx="22" fill="#192239"/><text x="578" y="315" fill="#c2ed67" font-size="13" font-weight="700" letter-spacing="1.5">APPLICATION / VERCEL</text><text x="578" y="361" fill="white" font-size="32" font-weight="700">GroundTruth server</text><path d="M578 389h359" stroke="#586172"/><text x="578" y="434" fill="white" font-size="20">Authentication and role checks</text><text x="578" y="477" fill="white" font-size="20">Source and output validation</text><text x="578" y="520" fill="white" font-size="20">Independent-mode restrictions</text><text x="578" y="563" fill="white" font-size="20">Budgets and immutable answers</text><text x="578" y="637" fill="#c2ed67" font-size="17">Keys stay on the server.</text>
<rect x="1150" y="270" width="375" height="140" rx="18" fill="#e9f2ed" stroke="#17695f"/><text x="1176" y="310" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">PERSISTENCE</text><text x="1176" y="348" fill="#192239" font-size="27" font-weight="700">Supabase PostgreSQL</text><text x="1176" y="382" fill="#647082" font-size="17">Accounts, paths, attempts, reviews</text>
<rect x="1150" y="435" width="375" height="140" rx="18" fill="white" stroke="#dfe3e8"/><text x="1176" y="475" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">CONTEXTUAL GUIDANCE</text><text x="1176" y="513" fill="#192239" font-size="27" font-weight="700">Meta Model API</text><text x="1176" y="547" fill="#647082" font-size="17">Muse Spark 1.3 Standard</text>
<rect x="1150" y="600" width="375" height="140" rx="18" fill="white" stroke="#dfe3e8"/><text x="1176" y="640" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">PINNED SOURCE</text><text x="1176" y="678" fill="#192239" font-size="27" font-weight="700">Public GitHub repository</text><text x="1176" y="712" fill="#647082" font-size="17">Selected supported files, never executed</text>
<path d="M75 805h1450" stroke="#dfe3e8"/><text x="75" y="841" fill="#647082" font-size="15">Model output is a suggestion. The application enforces state. Humans review learning evidence.</text><text x="1525" y="870" text-anchor="end" fill="#647082" font-size="12">Architecture illustration · See release manifest for live verification</text></g>
</svg>
