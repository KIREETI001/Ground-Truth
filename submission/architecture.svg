<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">GroundTruth — source, private change and review architecture</title><desc id="desc">Learner and approved teacher browsers connect to GroundTruth on Vercel. The server preserves pinned source, owned draft changes and original attempts, calls Meta for contextual teaching content and stores private records in Supabase. Teachers review explicitly shared evidence. This illustration does not prove a live request or learning outcome.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="m1 1 7 4-7 4" fill="none" stroke="#17695f" stroke-width="1.5"/></marker></defs>
<rect width="1600" height="900" fill="#fafaf7"/>
<g font-family="Arial,Helvetica,sans-serif"><text x="75" y="85" fill="#17695f" font-size="15" font-weight="700" letter-spacing="2">GROUNDTRUTH / CLOUD ARCHITECTURE</text><text x="70" y="151" fill="#192239" font-size="49" font-weight="700" letter-spacing="-1.8">Understand a system. Inspect a change.</text><text x="75" y="193" fill="#647082" font-size="22">Pinned code → reviewed private edit → original attempt → human follow-up.</text></g>
<g fill="none" stroke="#17695f" stroke-width="2.5" marker-end="url(#arrow)"><path d="M385 360H545"/><path d="M385 610H465V455H545"/><path d="M970 375H1085V335H1150"/><path d="M970 455H1150"/><path d="M970 535H1085V635H1150"/></g>
<g font-family="Arial,Helvetica,sans-serif"><rect x="75" y="280" width="310" height="160" rx="18" fill="white" stroke="#dfe3e8"/><text x="100" y="319" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">LEARNER</text><text x="100" y="359" fill="#192239" font-size="28" font-weight="700">Student browser</text><text x="100" y="397" fill="#647082" font-size="16">Code, concepts and private draft</text><text x="100" y="421" fill="#647082" font-size="15">Commit, then try a fresh variation</text>
<rect x="75" y="535" width="310" height="160" rx="18" fill="white" stroke="#dfe3e8"/><text x="100" y="574" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">HUMAN REVIEW</text><text x="100" y="614" fill="#192239" font-size="28" font-weight="700">Teacher browser</text><text x="100" y="650" fill="#647082" font-size="16">Named queue + explicit shares</text><text x="100" y="675" fill="#647082" font-size="15">Qualified human judgement</text>
<rect x="545" y="270" width="425" height="425" rx="22" fill="#192239"/><text x="578" y="315" fill="#c2ed67" font-size="13" font-weight="700" letter-spacing="1.5">APPLICATION / VERCEL</text><text x="578" y="361" fill="white" font-size="32" font-weight="700">GroundTruth server</text><path d="M578 389h359" stroke="#586172"/><text x="578" y="428" fill="white" font-size="18">Auth, roles and explicit shares</text><text x="578" y="468" fill="white" font-size="18">Owned draft diff + source hashes</text><text x="578" y="508" fill="white" font-size="18">Pause in-app study assistance</text><text x="578" y="548" fill="white" font-size="18">Original answers + linked variation</text><text x="578" y="588" fill="white" font-size="18">Budgets + sanitized API receipts</text><text x="578" y="637" fill="#c2ed67" font-size="17">Keys stay on the server.</text>
<rect x="1150" y="270" width="375" height="140" rx="18" fill="#e9f2ed" stroke="#17695f"/><text x="1176" y="310" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">PERSISTENCE</text><text x="1176" y="348" fill="#192239" font-size="27" font-weight="700">Supabase PostgreSQL</text><text x="1176" y="382" fill="#647082" font-size="17">Private drafts, attempts, reviews</text>
<rect x="1150" y="435" width="375" height="140" rx="18" fill="white" stroke="#dfe3e8"/><text x="1176" y="475" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">CONTEXTUAL GUIDANCE</text><text x="1176" y="513" fill="#192239" font-size="27" font-weight="700">Meta Model API</text><text x="1176" y="543" fill="#647082" font-size="17">Muse Spark 1.3 Standard</text><text x="1176" y="564" fill="#647082" font-size="14">Workflow maps + linked MCQ/code</text>
<rect x="1150" y="600" width="375" height="140" rx="18" fill="white" stroke="#dfe3e8"/><text x="1176" y="640" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">PINNED SOURCE</text><text x="1176" y="678" fill="#192239" font-size="27" font-weight="700">Public GitHub repository</text><text x="1176" y="712" fill="#647082" font-size="17">Selected source, never run by the app</text>
<path d="M75 805h1450" stroke="#dfe3e8"/><text x="75" y="841" fill="#647082" font-size="15">Observed and reviewed states support human follow-up, not mastery percentages or outside-AI detection.</text><text x="1525" y="870" text-anchor="end" fill="#647082" font-size="12">Architecture illustration · Release evidence is separate</text></g>
