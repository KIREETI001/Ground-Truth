<title id="title">GroundTruth — Understand your code. Think in systems.</title><desc id="desc">Editorial project thumbnail showing source, concepts and an independent attempt as a conceptual learning path. This is not a product screenshot.</desc>
<rect width="1280" height="720" fill="#fafaf7"/>
<g transform="translate(70 55)"><rect width="17" height="17" rx="4" fill="#6b40e8"/><rect x="22" width="17" height="17" rx="4" fill="#6b40e8"/><rect y="22" width="17" height="17" rx="4" fill="#a58aef"/><rect x="22" y="22" width="17" height="17" rx="4" fill="#c2ed67"/><text x="56" y="31" fill="#192239" font-family="Arial,Helvetica,sans-serif" font-weight="700" font-size="34">GroundTruth<tspan fill="#6b40e8">.</tspan></text></g>
<text x="70" y="169" fill="#17695f" font-family="Arial,Helvetica,sans-serif" font-size="15" font-weight="700" letter-spacing="2.2">FROM GENERATED SOFTWARE TO INDEPENDENT BUILDERS</text>
<text x="65" y="258" fill="#192239" font-family="Arial,Helvetica,sans-serif" font-size="75" font-weight="700" letter-spacing="-3">Understand your code.</text>
<text x="65" y="343" fill="#17695f" font-family="Georgia,serif" font-size="80" letter-spacing="-2">Think in systems.</text>
<text x="70" y="402" fill="#647082" font-family="Arial,Helvetica,sans-serif" font-size="24">Let AI cook. Know the recipe.</text>
<text x="70" y="440" fill="#192239" font-family="Arial,Helvetica,sans-serif" font-size="21">A learning path for builders. Inspectable evidence for teachers.</text>
<g font-family="Arial,Helvetica,sans-serif"><rect x="70" y="470" width="340" height="144" rx="18" fill="white" stroke="#dfe3e8"/><text x="96" y="508" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">01 / CONNECT</text><text x="96" y="545" fill="#192239" font-size="26" font-weight="700">Code → architecture</text><text x="96" y="580" fill="#647082" font-size="18">Understand a real workflow.</text><path d="M430 542h28m-8-8 8 8-8 8" stroke="#17695f" stroke-width="2.5" fill="none"/><rect x="480" y="470" width="340" height="144" rx="18" fill="#e9f2ed" stroke="#17695f"/><text x="506" y="508" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">02 / PRACTISE</text><text x="506" y="545" fill="#192239" font-size="26" font-weight="700">AI steps aside</text><text x="506" y="580" fill="#647082" font-size="18">Try the next step independently.</text><path d="M840 542h28m-8-8 8 8-8 8" stroke="#17695f" stroke-width="2.5" fill="none"/><rect x="890" y="470" width="320" height="144" rx="18" fill="white" stroke="#dfe3e8"/><text x="916" y="508" fill="#17695f" font-size="13" font-weight="700" letter-spacing="1.5">03 / REVIEW</text><text x="916" y="545" fill="#192239" font-size="26" font-weight="700">Show understanding</text><text x="916" y="580" fill="#647082" font-size="18">Support human review.</text></g>
